<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lyca Mobile workspace entry (served for /lyca and /lyca/*; see
         vite.config.ts and vercel.json). Same app bundle as index.html —
         only the pre-JavaScript document metadata differs, so a Lyca page
         never shows Adobe's title, icon or link preview. -->
    <link rel="icon" type="image/png" href="/branding/lyca/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006ae0" />
    <meta
      name="description"
      content="Secure Lyca Mobile Longlist dashboard portal — view hiring dashboards and track candidate status in real time."
    />
    <title>Lyca Mobile Longlist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
